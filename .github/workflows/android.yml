name: Android CI
on:
  workflow_dispatch:
  workflow_call:

jobs:
  android:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Set HAXEPATH
        run: echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Install Haxe dependencies
        run: |
          haxelib git hxcpp https://github.com/FunkinCrew/hxcpp --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet

      - name: Configure Lime & Android support
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }} -nocffi
          haxelib run lime config ANDROID_SETUP true -nocffi

      - name: Update SDL_image's submodules
        run: |
          cd ./project/lib/sdl_image
          git submodule update --init --recursive --force

      - name: Remove Previous NDLLs
        run: |
          rm -rf ./ndll
          mkdir ./ndll

      - name: Rebuild Lime
        run: |
          haxelib run lime rebuild hxcpp
          haxelib run lime rebuild android -release

      - name: Upload Artifact (ndll/Android)
        uses: actions/upload-artifact@v7
        with:
          name: Android-NDLL
          path: ndll/Android
          if-no-files-found: error
